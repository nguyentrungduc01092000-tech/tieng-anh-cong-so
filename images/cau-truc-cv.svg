<svg xmlns="http://www.w3.org/2000/svg" width="720" height="622" viewBox="0 0 720 622" role="img" aria-labelledby="title desc">
  <title id="title">Một CV tốt gồm 6 mục, theo thứ tự từ trên xuống</title>
  <desc id="desc">Sơ đồ được vẽ riêng cho website: một CV tốt gồm 6 mục theo thứ tự từ trên xuống, theo tài liệu A CV của British Council. 1 thông tin liên hệ, 2 đoạn giới thiệu ngắn, 3 kinh nghiệm làm việc, 4 học vấn, 5 kỹ năng và sở thích, 6 người tham chiếu.</desc>
  <rect width="720" height="622" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">Một CV tốt gồm 6 mục, theo thứ tự từ trên xuống</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">1. Thông tin liên hệ</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Tên đầy đủ, số điện thoại, email nghiêm túc</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">2. Đoạn giới thiệu ngắn (Profile)</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">2–3 câu: bạn là ai, bạn mang lại điều gì</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">3. Kinh nghiệm làm việc</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Từ công việc gần nhất, 2–3 gạch đầu dòng</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">4. Học vấn (Education)</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">Bằng gần nhất, tên bằng, nơi học, năm tốt nghiệp</text>
    <text x="360" y="412" text-anchor="middle" font-size="20" fill="#4a2d7a">↓</text>
    <rect x="110" y="418" width="500" height="64" rx="8" fill="#d5f0f0" stroke="#0f5b5b" stroke-width="2"/>
    <text x="360" y="444" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f5b5b">5. Kỹ năng và sở thích</text>
    <text x="360" y="466" text-anchor="middle" font-size="14" fill="#0f5b5b">Chỉ ghi kỹ năng và sở thích liên quan</text>
    <text x="360" y="504" text-anchor="middle" font-size="20" fill="#0f5b5b">↓</text>
    <rect x="110" y="510" width="500" height="64" rx="8" fill="#fbe3e3" stroke="#7a2d2d" stroke-width="2"/>
    <text x="360" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a2d2d">6. Người tham chiếu (References)</text>
    <text x="360" y="558" text-anchor="middle" font-size="14" fill="#7a2d2d">Hoặc ghi: References available on request</text>
  </g>
  <text x="360" y="608" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa được vẽ riêng cho website, theo Bài 19</text>
</svg>
