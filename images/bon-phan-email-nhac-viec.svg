<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">4 phần của một email nhắc việc</title>
  <desc id="desc">một email nhắc việc tốt có 4 phần. Phần 1 nhắc lại việc cũ bằng một câu, phần 2 nói rõ cần làm gì, phần 3 ghi thời hạn, phần 4 cho người nhận một lối ra.</desc>
  <rect width="720" height="438" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">4 phần của một email nhắc việc</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">Phần 1: Nhắc lại việc cũ bằng một câu</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Tôi đã gửi báo cáo tháng 11 vào thứ Hai.</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">Phần 2: Nói rõ cần làm gì</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">Một câu: việc cần làm, người làm, thời hạn</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">Phần 3: Ghi thời hạn</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Ghi một ngày cụ thể, không viết soon hay ASAP</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">Phần 4: Cho người nhận một lối ra</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">Nếu bạn bận, tôi gửi bản tóm tắt một trang.</text>
  </g>
  <text x="360" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Sơ đồ 4 phần của một email nhắc việc.</text>
</svg>
