<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">Trước khi nói: 4 việc chuẩn bị</title>
  <desc id="desc">Sơ đồ tự vẽ: 4 việc chuẩn bị trước khi nói chuyện khó, theo Harvard Business Review. 1 đổi cách nghĩ về cuộc trò chuyện, 2 bình tĩnh trước khi nói, 3 chuẩn bị ý chính nhưng đừng viết kịch bản, 4 tự hỏi hai câu trước khi mở miệng.</desc>
  <rect width="720" height="438" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">Trước khi nói: 4 việc chuẩn bị</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">1. Đổi cách nghĩ về cuộc trò chuyện</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Đưa ra giải pháp khác, không phải phản đối sếp</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">2. Bình tĩnh trước khi nói</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">Đừng bắt đầu khi đang giận</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">3. Chuẩn bị ý chính, đừng viết kịch bản</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Chiến lược linh hoạt, nhiều cách đáp lại</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">4. Tự hỏi hai câu trước khi mở miệng</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">Vấn đề là gì? Người kia nghĩ vấn đề là gì?</text>
  </g>
  <text x="360" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa do người viết của website tự vẽ, theo Bài 20</text>
</svg>
