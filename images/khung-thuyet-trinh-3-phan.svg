<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Khung 3 phần của một bài thuyết trình ngắn bằng tiếng Anh</title>
  <desc id="desc">Sơ đồ tự vẽ: ba ô xếp dọc theo thứ tự, rồi một ô câu hỏi. Phần 1: Mở đầu nói chủ đề và thời gian. Phần 2: Ý chính gồm 2 đến 3 ý, mỗi ý có điểm, lý do và ví dụ. Phần 3: Kết thúc tóm tắt và nói bước tiếp theo. Sau đó: phần câu hỏi.</desc>
  <rect width="720" height="380" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">Khung 3 phần của một bài thuyết trình ngắn</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="44" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="78" text-anchor="middle" font-size="16" fill="#1a3a5c">Phần 1: Mở đầu nói chủ đề và thời gian</text>
    <text x="360" y="112" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="120" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="148" text-anchor="middle" font-size="16" fill="#2e6b34">Phần 2: Ý chính gồm 2 đến 3 ý</text>
    <text x="360" y="170" text-anchor="middle" font-size="14" fill="#2e6b34">Mỗi ý có điểm, lý do và ví dụ</text>
    <text x="360" y="202" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="210" width="500" height="44" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="238" text-anchor="middle" font-size="16" fill="#8a5a00">Phần 3: Kết thúc tóm tắt và nói bước tiếp theo</text>
    <text x="360" y="272" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="280" width="500" height="44" rx="8" fill="#f3e2ee" stroke="#7a2e5c" stroke-width="2"/>
    <text x="360" y="308" text-anchor="middle" font-size="16" fill="#7a2e5c">Sau đó: phần câu hỏi</text>
  </g>
  <text x="360" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa do người viết của website tự vẽ, theo Bài 06</text>
</svg>
