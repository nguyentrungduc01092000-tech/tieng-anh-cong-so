<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">4 phần của một email xin lỗi</title>
  <desc id="desc">Sơ đồ được vẽ riêng cho website: một email xin lỗi có 4 phần. Phần 1 nói rõ lỗi gì, phần 2 nói ảnh hưởng tới người nhận, phần 3 nói cách sửa và khi nào xong, phần 4 nói cách tránh lặp lại.</desc>
  <rect width="720" height="438" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">4 phần của một email xin lỗi</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">Phần 1: Nói rõ lỗi gì</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Lỗi nằm trong câu đầu tiên, không vòng vo</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">Phần 2: Nói ảnh hưởng tới người nhận</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">Cho thấy bạn hiểu hậu quả của lỗi</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">Phần 3: Nói cách sửa và khi nào xong</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Đã sửa xong, hoặc ghi rõ khi nào xong</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">Phần 4: Nói cách tránh lặp lại</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">Một việc cụ thể bạn sẽ làm khác đi</text>
  </g>
  <text x="360" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa được vẽ riêng cho website, theo Bài 16</text>
</svg>
