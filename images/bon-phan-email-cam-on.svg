<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">4 phần của một email cảm ơn sau phỏng vấn</title>
  <desc id="desc">Sơ đồ tự vẽ: một email cảm ơn sau phỏng vấn có 4 phần. Phần 1 cảm ơn vì thời gian, phần 2 nhắc một chi tiết cụ thể, phần 3 nói rõ mình vẫn muốn công việc này, phần 4 sẵn sàng trả lời thêm.</desc>
  <rect width="720" height="438" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">4 phần của một email cảm ơn sau phỏng vấn</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">Phần 1: Cảm ơn vì thời gian</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Cảm ơn, thời gian gặp, vị trí công việc</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">Phần 2: Nhắc một chi tiết cụ thể</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">Một điều hai bên đã nói trong buổi phỏng vấn</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">Phần 3: Nói rõ mình vẫn muốn công việc này</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Muốn công việc này, và vì sao bạn phù hợp</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">Phần 4: Sẵn sàng trả lời thêm</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">Có mặt để trả lời, không tạo thêm việc</text>
  </g>
  <text x="360" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa do người viết của website tự vẽ, theo Bài 17</text>
</svg>
