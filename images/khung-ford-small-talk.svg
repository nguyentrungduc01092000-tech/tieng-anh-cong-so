<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">Khung FORD: 4 nhóm chủ đề an toàn khi small talk</title>
  <desc id="desc">Sơ đồ được vẽ riêng cho website: khung FORD gồm 4 nhóm chủ đề an toàn khi small talk. F Family gia đình, O Occupation công việc, R Recreation sở thích, D Dreams ước mơ.</desc>
  <rect width="720" height="438" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">Khung FORD: 4 nhóm chủ đề an toàn khi small talk</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">F — Family (gia đình)</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Hỏi chung chung, không hỏi sâu chuyện riêng tư</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">O — Occupation (công việc)</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">Dự án mới, công việc trong tuần</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">R — Recreation (sở thích)</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Thể thao, thời gian rảnh, cuối tuần</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">D — Dreams (ước mơ)</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">Kế hoạch nghỉ lễ, nơi muốn tới thăm</text>
  </g>
  <text x="360" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa được vẽ riêng cho website, theo bài "Cách small talk với đồng nghiệp và đối tác"</text>
</svg>
