<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">Lộ trình tự học 8 tuần, 20 phút mỗi ngày</title>
  <desc id="desc">Sơ đồ được vẽ riêng cho website: lộ trình tự học 8 tuần theo 4 giai đoạn, mỗi ngày 20 phút. Giai đoạn 1 tuần 1-2 nghe và bắt chước, giai đoạn 2 tuần 3-4 nói trong cuộc họp, giai đoạn 3 tuần 5-6 viết email ngắn, giai đoạn 4 tuần 7-8 nói chuyện công sở và ôn tổng hợp.</desc>
  <rect width="720" height="438" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">Lộ trình tự học 8 tuần, 20 phút mỗi ngày</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">Giai đoạn 1: Tuần 1–2 — Nghe và bắt chước</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Nghe 5 phút, bắt chước 10 phút, ghi chú 5 phút</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">Giai đoạn 2: Tuần 3–4 — Nói trong cuộc họp</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">Ôn 5 câu họp, tập nói và thay chi tiết</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">Giai đoạn 3: Tuần 5–6 — Viết email ngắn</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Đọc mẫu 5 phút, viết email 4–6 câu trong 10 phút</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">Giai đoạn 4: Tuần 7–8 — Nói chuyện công sở</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">Ôn câu họp, luyện tình huống, ghi chú, ôn tổng hợp</text>
  </g>
  <text x="360" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa được vẽ riêng cho website, theo Bài 02</text>
</svg>
