<svg xmlns="http://www.w3.org/2000/svg" width="720" height="622" viewBox="0 0 720 622" role="img" aria-labelledby="title desc">
  <title id="title">30 mẫu câu họp theo 6 nhóm tình huống</title>
  <desc id="desc">Sơ đồ được vẽ riêng cho website: 30 mẫu câu họp chia theo 6 nhóm tình huống. Nhóm 1 mở đầu 5 câu, nhóm 2 trình bày ý kiến 5 câu, nhóm 3 hỏi lại khi chưa hiểu 5 câu, nhóm 4 đồng ý và phản đối lịch sự 6 câu, nhóm 5 hỏi ý kiến người khác 4 câu, nhóm 6 kết thúc và nhận việc 5 câu.</desc>
  <rect width="720" height="622" fill="#f7f7f2"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">30 mẫu câu họp theo 6 nhóm tình huống</text>
  <g font-family="sans-serif">
    <rect x="110" y="50" width="500" height="64" rx="8" fill="#dcebf7" stroke="#1a3a5c" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">Nhóm 1: Mở đầu — 5 câu</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a3a5c">Let's get started.</text>
    <text x="360" y="136" text-anchor="middle" font-size="20" fill="#1a3a5c">↓</text>
    <rect x="110" y="142" width="500" height="64" rx="8" fill="#e3f2e1" stroke="#2e6b34" stroke-width="2"/>
    <text x="360" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6b34">Nhóm 2: Trình bày ý kiến — 5 câu</text>
    <text x="360" y="190" text-anchor="middle" font-size="14" fill="#2e6b34">In my opinion, we should...</text>
    <text x="360" y="228" text-anchor="middle" font-size="20" fill="#2e6b34">↓</text>
    <rect x="110" y="234" width="500" height="64" rx="8" fill="#fdf0d5" stroke="#8a5a00" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">Nhóm 3: Hỏi lại khi chưa hiểu — 5 câu</text>
    <text x="360" y="282" text-anchor="middle" font-size="14" fill="#8a5a00">Sorry, could you repeat that, please?</text>
    <text x="360" y="320" text-anchor="middle" font-size="20" fill="#8a5a00">↓</text>
    <rect x="110" y="326" width="500" height="64" rx="8" fill="#e8e0f5" stroke="#4a2d7a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2d7a">Nhóm 4: Đồng ý và phản đối lịch sự — 6 câu</text>
    <text x="360" y="374" text-anchor="middle" font-size="14" fill="#4a2d7a">That sounds good to me.</text>
    <text x="360" y="412" text-anchor="middle" font-size="20" fill="#4a2d7a">↓</text>
    <rect x="110" y="418" width="500" height="64" rx="8" fill="#d5f0f0" stroke="#0f5b5b" stroke-width="2"/>
    <text x="360" y="444" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f5b5b">Nhóm 5: Hỏi ý kiến người khác — 4 câu</text>
    <text x="360" y="466" text-anchor="middle" font-size="14" fill="#0f5b5b">What do you think about this?</text>
    <text x="360" y="504" text-anchor="middle" font-size="20" fill="#0f5b5b">↓</text>
    <rect x="110" y="510" width="500" height="64" rx="8" fill="#fbe3e3" stroke="#7a2d2d" stroke-width="2"/>
    <text x="360" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a2d2d">Nhóm 6: Kết thúc và nhận việc — 5 câu</text>
    <text x="360" y="558" text-anchor="middle" font-size="14" fill="#7a2d2d">To summarise, we agreed to...</text>
  </g>
  <text x="360" y="608" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Hình minh họa được vẽ riêng cho website, theo Bài 01</text>
</svg>
